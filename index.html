<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="importmap">
      {
        "imports": {
          "@jtarrio/webrtlsdr/": "/dist/"
        }
      }
    </script>
    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="bg-slate-50 font-sans text-slate-900 dark:bg-[#121212] dark:text-[#e0e0e0]">
    <main class="mx-auto max-w-3xl space-y-8 px-4 py-10 sm:px-6 lg:px-8">
      <header class="space-y-2">
        <h1 class="text-2xl font-semibold text-slate-900 dark:text-[#e0e0e0]">
          RTL-SDR Signal Power Meter
        </h1>
        <p class="max-w-xl text-sm text-slate-600 dark:text-[#a0a0a0]">
          Measure either the peak or average power of the received signal. Stepping stone to the phone detector.
        </p>
      </header>

      <span id="usbWarning" class="text-lg font-semibold text-slate-900 dark:text-slate-100 hidden">WebUSB API not supported in this browser.</span>

      <section id="mainSection" class="space-y-6">
        <button
          id="startButton"
          class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 disabled:bg-indigo-300 dark:bg-[#bb86fc] dark:hover:bg-[#a673f2] dark:focus:ring-[#bb86fc]/40 dark:disabled:bg-[#3a2966]"
        >
          Start
        </button>

        <div class="space-y-5">
          <div class="space-y-1">
            <label for="frequencyInput" class="text-sm font-medium text-slate-700 dark:text-[#e0e0e0]">
              Center frequency
            </label>
            <input
              id="frequencyInput"
              type="number"
              value="13560000"
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-[#333333] dark:bg-[#1e1e1e] dark:text-[#e0e0e0] dark:focus:border-[#bb86fc] dark:focus:ring-[#bb86fc]"
            />
          </div>

          <div class="space-y-3">
            <label for="gainInput" class="text-sm font-medium text-slate-700 dark:text-[#e0e0e0]">
              Gain
            </label>
            <input
              id="gainInput"
              type="range"
              min="0"
              max="50"
              disabled
              class="w-full accent-indigo-600 disabled:opacity-50 dark:accent-[#bb86fc]"
            />
            <label for="autoGainBox" class="inline-flex items-center gap-2 text-sm text-slate-600 dark:text-[#a0a0a0]">
              <input
                id="autoGainBox"
                type="checkbox"
                checked
                class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 dark:border-[#444444] dark:bg-[#1e1e1e] dark:text-[#bb86fc] dark:focus:ring-[#bb86fc]"
              />
              Auto gain
            </label>
          </div>

          <div class="space-y-1">
            <label for="thresholdInput" class="text-sm font-medium text-slate-700 dark:text-[#e0e0e0] flex justify-between">
              <span>Threshold</span>
              <span id="thresholdValue" class="text-slate-500 dark:text-[#a0a0a0]">-21.5 dB</span>
            </label>

            <input
              id="thresholdInput"
              type="range"
              min="-60"
              max="0"
              value="-21.5"
              step="0.1"
              class="w-full accent-indigo-600 dark:accent-[#bb86fc]"
              oninput="thresholdValue.textContent = this.value + ' dB'"
            />

            <div class="flex items-center justify-between">
              <span class="text-sm text-slate-500 dark:text-[#a0a0a0]">-60 dB</span>
              <span class="text-sm text-slate-500 dark:text-[#a0a0a0]">0 dB</span>
            </div>
          </div>

          <div class="space-y-1">
            <label for="measurementModeInput" class="text-sm font-medium text-slate-700 dark:text-[#e0e0e0]">
              Measurement mode
            </label>
            <br />
            <select
              id="measurementModeInput"
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:w-48 dark:border-[#333333] dark:bg-[#1e1e1e] dark:text-[#e0e0e0] dark:focus:border-[#bb86fc] dark:focus:ring-[#bb86fc]"
            >
              <option value="peak" selected>Peak power (dB)</option>
              <option value="average">Average power (dB)</option>
            </select>
          </div>


          <div class="space-y-1">
            <label for="bandwidthInput" class="text-sm font-medium text-slate-700 dark:text-[#e0e0e0]">
              Bandwidth
            </label>
            <div class="flex items-center gap-2">
              <input
                id="bandwidthInput"
                type="number"
                min="1"
                max="1024000"
                step="1000"
                value="250"
                class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:w-48 dark:border-[#333333] dark:bg-[#1e1e1e] dark:text-[#e0e0e0] dark:focus:border-[#bb86fc] dark:focus:ring-[#bb86fc]"
              />
              <span class="text-sm text-slate-500 dark:text-[#a0a0a0]">Hz</span>
            </div>
          </div>

          <div class="space-y-1">
            <label for="numSamplesInput" class="text-sm font-medium text-slate-700 dark:text-[#e0e0e0]">
              Number of samples to read
            </label>
            <div class="flex items-center gap-2">
              <input
                id="numSamplesInput"
                type="number"
                value="100"
                class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:w-48 dark:border-[#333333] dark:bg-[#1e1e1e] dark:text-[#e0e0e0] dark:focus:border-[#bb86fc] dark:focus:ring-[#bb86fc]"
              />
              <span class="text-sm text-slate-500 dark:text-[#a0a0a0]">samples</span>
            </div>
          </div>
        </div>

        <fieldset class="space-y-3 rounded-md border border-slate-200 bg-white/80 p-4 dark:border-[#2a2a2a] dark:bg-[#1e1e1e]">
          <legend class="px-1 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-[#a0a0a0]">
            Log
          </legend>
          <div
            id="logArea"
            role="log"
            aria-live="polite"
            class="min-h-64 w-full space-y-2 overflow-y-auto rounded border border-slate-300 bg-white p-3 font-mono text-sm leading-relaxed text-slate-700 shadow-inner dark:border-[#333333] dark:bg-[#1e1e1e] dark:text-[#e0e0e0]"
          ></div>
        </fieldset>
      </section>
    </main>
  </body>
</html>
